name: Migrate Cloudflare D1

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: D1 database name bound as DB in the Pages project
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply conversation category migration
        uses: cloudflare/wrangler-action@v4
        env:
          D1_DATABASE_NAME: ${{ inputs.database_name }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute "$D1_DATABASE_NAME" --remote --file=./migrations/0001_add_conversation_category.sql